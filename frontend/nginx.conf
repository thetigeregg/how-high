worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip on;
  gzip_types text/css application/javascript application/json;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver, used with a variable in proxy_pass below
    # so the backend hostname is resolved per-request rather than once at
    # nginx startup — keeps this container from failing to start if it comes
    # up before the backend service does.
    resolver 127.0.0.11 valid=30s;

    location / {
      try_files $uri /index.html;
    }

    location /api/ {
      set $backend "http://how-high-backend:3000";
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # GPX uploads, and long routes that first have to download terrain for
      # their whole length (a 200 km train ride took about four minutes).
      client_max_body_size 25m;
      proxy_read_timeout 900s;
    }
  }
}
